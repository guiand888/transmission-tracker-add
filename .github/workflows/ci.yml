name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # ShellCheck is preinstalled on the GitHub-hosted ubuntu images, so
      # this needs no third-party action and no install step.
      - name: ShellCheck
        run: shellcheck --shell=bash --severity=style tracker-add.sh

      - name: bash -n
        run: bash -n tracker-add.sh

      # Run hadolint from its own image rather than a marketplace action:
      # one fewer third party with any access to the workflow.
      - name: Hadolint
        run: docker run --rm -i ghcr.io/hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < Dockerfile

      # Interpolation and schema only; does not clone the git build context.
      - name: Validate compose.yaml
        run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build from the checkout
        run: |
          docker build \
            --build-arg TRACKER_ADD_VERSION=ci \
            --build-arg TRACKER_ADD_REVISION="$GITHUB_SHA" \
            -t tracker-add:ci .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash tracker-add:ci -n /usr/local/bin/tracker-add.sh
          docker run --rm --entrypoint sh tracker-add:ci -c 'command -v bash curl jq >/dev/null'
          test "$(docker run --rm --entrypoint id tracker-add:ci -u)" = "1001"
          test "$(docker run --rm --entrypoint id tracker-add:ci -g)" = "1001"

  build-from-tag:
    # The git-context build is what every consumer of compose.yaml actually
    # runs, and it is NOT exercised by the local `docker build .` above.
    # Verify it against the real, just-pushed tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build exactly as compose.yaml does for consumers
        env:
          TRACKER_ADD_TAG: ${{ github.ref_name }}
        run: docker compose build
